<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>मेरा एचटीएमएल पेज</title>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
color: #333;
margin: 0;
padding: 0;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
}
.container {
background: white;
padding: 40px;
border-radius: 12px;
box-shadow: 0 10px 25px rgba(0,0,0,0.1);
text-align: center;
max-width: 400px;
width: 100%;
}
h1 {
color: #2c3e50;
margin-bottom: 20px;
}
p {
color: #7f8c8d;
line-height: 1.6;
margin-bottom: 30px;
}
.btn {
background-color: #3498db;
color: white;
border: none;
padding: 12px 25px;
font-size: 16px;
border-radius: 6px;
cursor: pointer;
transition: background 0.3s ease;
}
.btn:hover {
background-color: #2980b9;
}
</style>
</head>
<body>
​<div class="container">
<h1>नमस्ते दुनिया!</h1>
<p>यह आपकी डाउनलोड की गई एचटीएमएल फाइल है। आप इसमें अपनी पसंद के अनुसार बदलाव कर सकते हैं।</p>
<button class="btn" onclick="showAlert()">क्लिक करें</button>
</div>
​<script>
function showAlert() {
alert('आपने बटन पर क्लिक किया!');
}
</script>
​</body>
</html>
