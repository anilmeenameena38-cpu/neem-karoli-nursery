<script>
document.addEventListener('DOMContentLoaded', function () {
const paymentProofInput = document.getElementById('paymentProofFile');
if (!paymentProofInput) return;
paymentProofInput.addEventListener('change', function () {
  const file = this.files && this.files[0], preview = document.getElementById('paymentProofPreview');
  const submitButton = document.getElementById('orderButton');
  if (submitButton) submitButton.style.display = 'none';
  if (!preview) return;
  preview.textContent = '';
  if (!file) return;
  if (!['image/jpeg','image/png','image/webp'].includes(file.type) || file.size > 5 * 1024 * 1024) {
    preview.textContent = '❌ कृपया JPG, PNG या WebP स्क्रीनशॉट चुनें, आकार 5 MB से अधिक न हो।';
    this.value = ''; return;
  }
  const image = document.createElement('img'); image.alt = 'भुगतान स्क्रीनशॉट का पूर्वावलोकन';
  image.style.cssText = 'display:block;max-width:100%;max-height:260px;margin:8px auto;border-radius:10px;border:1px solid #ddd';
  image.src = URL.createObjectURL(file); image.onload = () => URL.revokeObjectURL(image.src); preview.appendChild(image);
  const note = document.createElement('div'); note.textContent = '✅ स्क्रीनशॉट चुना गया: ' + file.name; preview.appendChild(note);
  if (submitButton) { submitButton.style.display = 'block'; submitButton.textContent = 'Submit & Send Order'; }
});
});
</script>
